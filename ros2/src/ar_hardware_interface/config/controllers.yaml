controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.0
      joint_1: { trajectory: 0.5, goal: 0.1 }
      joint_2: { trajectory: 1.5, goal: 0.3 }
      joint_3: { trajectory: 0.5, goal: 0.1 }
      joint_4: { trajectory: 0.5, goal: 0.1 }
      joint_5: { trajectory: 0.5, goal: 0.1 }
      joint_6: { trajectory: 0.5, goal: 0.1 }
    state_tolerances:
      joint_1: { position: 0.5 }
      joint_2: { position: 0.5 }
      joint_3: { position: 0.5 }
      joint_4: { position: 0.5 }
      joint_5: { position: 0.5 }
      joint_6: { position: 0.5 }
